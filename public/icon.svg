<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.4"/>

  <!-- Geometric Vortex Swirl & Diamond Shield -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Shield / Hexagon -->
    <path d="M 0 -160 L 140 -80 L 140 80 L 0 160 L -140 80 L -140 -80 Z" fill="none" stroke="url(#glow)" stroke-width="14" stroke-linejoin="round"/>

    <!-- Dynamic B Curve Lettermark -->
    <path d="M -60 -100 L 20 -100 C 65 -100 95 -75 95 -35 C 95 -5 70 15 35 20 C 75 25 105 55 105 95 C 105 135 70 160 15 160 L -60 160 Z" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Gold Accents (Crown & Chip Inlay) -->
    <circle cx="0" cy="0" r="28" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="14" fill="#020617"/>
    <path d="M -20 -15 L 0 -35 L 20 -15 L 12 5 L -12 5 Z" fill="url(#gold)"/>

    <!-- Four Star Sparks -->
    <polygon points="0,-190 6,-175 20,-170 6,-165 0,-150 -6,-165 -20,-170 -6,-175" fill="#34d399"/>
    <polygon points="170,0 155,6 150,20 145,6 130,0 145,-6 150,-20 155,-6" fill="#f59e0b"/>
  </g>
</svg>
